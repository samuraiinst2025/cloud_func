options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # ----------------------------------------------------------
  # 1. BuildpacksでPython Functionsコンテナをビルド
  # ----------------------------------------------------------
  - name: 'gcr.io/k8s-skaffold/pack'
    entrypoint: 'pack'
    args:
      - 'build'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/cloud-func:$COMMIT_SHA'
      - '--builder'
      - 'gcr.io/buildpacks/builder:latest'
      - '--path'
      - '.'
      - '--network'
      - 'cloudbuild'
      - '--publish'
      - '--env'
      - 'GOOGLE_FUNCTION_TARGET=edit_pdf'
      - '--env'
      - 'GOOGLE_FUNCTION_SIGNATURE_TYPE=http'

  # ----------------------------------------------------------
  # 2. Cloud Runへデプロイ
  # ----------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'cloud-func'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/cloud-func:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/cloud-func:$COMMIT_SHA'
